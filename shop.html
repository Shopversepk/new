<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — ShopVerse</title><link rel="stylesheet" href="assets/style.css"><script
  type="module"
  src="assets/firebase-products.js"
></script></head><body><script src="assets/header.js"></script><main class="container"><div class="page-title"><p class="eyebrow">DISCOVER THE COLLECTION</p><h1>Shop All Products</h1></div><div class="toolbar"><input id="q" placeholder="Search products..."><select id="cat"><option value="All">All categories</option><option>Fashion</option><option>Electronics</option><option>Beauty</option><option>Home</option><option>Sports</option><option>Accessories</option></select><select id="sort"><option value="default">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></div><p class="muted" id="count"></p><div class="products" id="products"></div></main><script src="assets/app.js"></script><script>const params=new URLSearchParams(location.search);q.value=params.get('q')||'';cat.value=params.get('cat')||'All';function refreshShop(){let list=products.filter(p=>(cat.value==='All'||p.cat===cat.value)&&p.name.toLowerCase().includes(q.value.toLowerCase()));if(sort.value==='low')list.sort((a,b)=>a.price-b.price);if(sort.value==='high')list.sort((a,b)=>b.price-a.price);document.getElementById('count').textContent=list.length+' products found';renderProducts('products',list)}[q,cat,sort].forEach(e=>e.addEventListener('input',refreshShop));document.addEventListener('DOMContentLoaded',refreshShop);</script><script src="assets/footer.js"></script>
<script src="assets/rellax.min.js"></script>
<script src="assets/animations.js"></script>
</body></html>
