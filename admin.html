<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | ShopVerse</title>

  <link rel="stylesheet" href="assets/admin.css">
</head>

<body class="admin-body">

  <aside class="sidebar">

    <a href="index.html" class="sidebar-logo">
      SHOPVERSE
    </a>

    <div class="admin-label">
      ADMIN PANEL
    </div>

    <nav class="admin-nav">
      <a href="#dashboard" class="active">📊 Dashboard</a>
      <a href="#products">📦 Products</a>
      <a href="index.html" target="_blank">🌐 View Website</a>
    </nav>

    <button id="logoutBtn" class="logout-btn">
      🚪 Logout
    </button>

  </aside>


  <main class="admin-main">

    <header class="admin-header">

      <div>
        <div class="small-title">
          SHOPVERSE MANAGEMENT
        </div>

        <h1>Dashboard</h1>
      </div>

      <div class="admin-user">

        <div class="user-circle">
          S
        </div>

        <div>
          <b id="adminEmail">Admin</b>
          <small>Store Administrator</small>
        </div>

      </div>

    </header>


    <section id="dashboard" class="stats-grid">

      <div class="stat-card">
        <div class="stat-icon">📦</div>

        <div>
          <span>Total Products</span>
          <h2 id="totalProducts">0</h2>
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-icon">💰</div>

        <div>
          <span>Total Store Value</span>
          <h2 id="totalValue">$0</h2>
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-icon">📂</div>

        <div>
          <span>Categories</span>
          <h2 id="totalCategories">0</h2>
        </div>
      </div>

    </section>


    <section class="admin-section">

      <div class="section-heading">
        <div>
          <span class="small-title">
            PRODUCT MANAGEMENT
          </span>

          <h2 id="formTitle">
            Add New Product
          </h2>
        </div>
      </div>


      <div class="form-card">

        <form id="productForm">

          <input type="hidden" id="editProductId">


          <div class="form-grid">

            <div class="form-group">

              <label>Product Name *</label>

              <input
                type="text"
                id="productName"
                placeholder="Example: Premium Sneakers"
                required
              >

            </div>


            <div class="form-group">

              <label>Category *</label>

              <select id="productCategory" required>

                <option value="">
                  Select Category
                </option>

                <option value="Fashion">Fashion</option>
                <option value="Electronics">Electronics</option>
                <option value="Beauty">Beauty</option>
                <option value="Home">Home</option>
                <option value="Sports">Sports</option>
                <option value="Accessories">Accessories</option>

              </select>

            </div>


            <div class="form-group">

              <label>Price ($) *</label>

              <input
                type="number"
                id="productPrice"
                placeholder="99"
                min="0"
                step="0.01"
                required
              >

            </div>


            <div class="form-group">

              <label>Product Image URL *</label>

              <input
                type="url"
                id="productImage"
                placeholder="https://example.com/image.jpg"
                required
              >

            </div>

          </div>


          <div class="form-group full-width">

            <label>Product Description *</label>

            <textarea
              id="productDescription"
              placeholder="Write complete product description..."
              required
            ></textarea>

          </div>


          <div id="imagePreviewBox" class="image-preview-box">

            <span>
              Image preview will appear here
            </span>

          </div>


          <div class="form-actions">

            <button
              type="submit"
              id="saveProductBtn"
              class="admin-primary-btn"
            >
              + Add Product
            </button>


            <button
              type="button"
              id="cancelEditBtn"
              class="admin-secondary-btn"
              style="display:none"
            >
              Cancel Edit
            </button>

          </div>


          <div
            id="formMessage"
            class="form-message"
          ></div>

        </form>

      </div>

    </section>


    <section id="products" class="admin-section">

      <div class="section-heading products-heading">

        <div>

          <span class="small-title">
            DATABASE
          </span>

          <h2>All Products</h2>

        </div>


        <input
          type="text"
          id="productSearch"
          placeholder="🔍 Search products..."
          class="search-input"
        >

      </div>


      <div
        id="adminProducts"
        class="admin-products-grid"
      >

        <div class="loading">
          Loading products...
        </div>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="assets/admin.js"
  ></script>

</body>
</html>
