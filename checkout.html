<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — ShopVerse</title><link rel="stylesheet" href="assets/style.css"><script
  type="module"
  src="assets/firebase-products.js"
></script></head><body><script src="assets/header.js"></script><main class="container"><div class="page-title"><h1>Checkout</h1><p class="muted">Demo checkout flow — connect your payment gateway for live payments.</p></div><div class="two-col"><form class="content-card form" onsubmit="placeOrder(event)"><h2>Shipping Information</h2><input required placeholder="Full name"><input required type="email" placeholder="Email address"><input required placeholder="Address"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><input required placeholder="City"><input required placeholder="Postal code"></div><select><option>Cash on Delivery</option><option>Card Payment (connect gateway)</option></select><button class="btn dark">Place Demo Order</button></form><div id="checkoutSummary"></div></div></main><script src="assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0);checkoutSummary.innerHTML=`<div class="content-card summary"><h2>Order Summary</h2>${cart.length?cart.map(x=>{let p=products.find(p=>p.id===x.id);return `<p>${p.name} × ${x.qty}<b style="float:right">$${p.price*x.qty}</b></p>`}).join(''):'<p>Your cart is empty.</p>'}<hr><h3>Total <span style="float:right">$${total}</span></h3></div>`});function placeOrder(e){e.preventDefault();if(!cart.length)return toast('Your cart is empty');cart=[];save();toast('Order placed successfully ✓');setTimeout(()=>location.href='index.html',1200)}</script><script src="assets/footer.js"></script>
<script src="assets/rellax.min.js"></script>
<script src="assets/animations.js"></script>
</body></html>
