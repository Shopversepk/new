<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — ShopVerse</title><link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/firebase-products.js"></script>
</head><body>
<script src="assets/header.js"></script>
<main class="container">
<div class="page-title"><h1>Secure Checkout</h1><p class="muted">Enter your delivery details. Your order status will be managed by ShopVerse.</p></div>
<div class="two-col">
<form id="checkoutForm" class="content-card form">
<h2>Customer & Delivery Information</h2>
<input id="fullName" required placeholder="Full name">
<input id="email" required type="email" placeholder="Email address">
<input id="phone" required placeholder="Phone number">
<input id="address" required placeholder="Complete address">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><input id="city" required placeholder="City"><input id="postalCode" placeholder="Postal code"></div>
<textarea id="notes" placeholder="Order notes (optional)" style="min-height:90px"></textarea>
<select id="paymentMethod"><option>Cash on Delivery</option></select>
<button id="placeOrderBtn" class="btn dark" type="submit">Place Order</button>
<p id="checkoutMessage" class="muted" style="margin-top:12px"></p>
</form>
<div id="checkoutSummary"></div>
</div>
</main>
<script src="assets/app.js"></script>
<script type="module">
import { db } from "./assets/firebase.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

function money(n){return "$"+Number(n||0).toFixed(2)}
function renderSummary(){
 const box=document.getElementById("checkoutSummary");
 const valid=cart.map(x=>({item:x,p:products.find(p=>p.id===x.id)})).filter(x=>x.p);
 const total=valid.reduce((s,x)=>s+x.p.price*x.item.qty,0);
 box.innerHTML=`<div class="content-card summary"><h2>Order Summary</h2>${valid.length?valid.map(({item,p})=>`<p>${p.name} × ${item.qty}<b style="float:right">${money(p.price*item.qty)}</b></p>`).join(""):"<p>Your cart is empty.</p>"}<hr><h3>Total <span style="float:right">${money(total)}</span></h3></div>`;
 return {valid,total};
}
document.addEventListener("DOMContentLoaded",renderSummary);
document.getElementById("checkoutForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const {valid,total}=renderSummary();
 const msg=document.getElementById("checkoutMessage"),btn=document.getElementById("placeOrderBtn");
 if(!valid.length){msg.textContent="Your cart is empty.";return}
 btn.disabled=true;btn.textContent="Placing order...";
 try{
  const order={
   customer:{name:fullName.value.trim(),email:email.value.trim(),phone:phone.value.trim(),address:address.value.trim(),city:city.value.trim(),postalCode:postalCode.value.trim()},
   notes:notes.value.trim(),paymentMethod:paymentMethod.value,
   items:valid.map(({item,p})=>({id:p.id,name:p.name,image:p.image,price:Number(p.price),qty:Number(item.qty)})),
   total:Number(total),status:"Order Placed",createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  };
  const ref=await addDoc(collection(db,"orders"),order);
  cart=[];save();
  localStorage.setItem("sv_last_order",ref.id);
  msg.textContent=`Order placed successfully! Order ID: ${ref.id}`;
  setTimeout(()=>location.href="index.html",1600);
 }catch(err){console.error(err);msg.textContent="Order could not be saved. Please check Firebase Firestore rules.";btn.disabled=false;btn.textContent="Place Order";}
});
</script>
<script src="assets/footer.js"></script><script src="assets/rellax.min.js"></script><script src="assets/animations.js"></script>
</body></html>
