<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — ShopVerse</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/header.js"></script><main class="container" id="productPage"></main><script src="assets/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let p=products.find(x=>x.id==getParam('id'))||products[0];document.title=p.name+' — ShopVerse';productPage.innerHTML=`<div class="two-col"><img class="detail-image" src="${p.image}" alt="${p.name}"><div><p class="eyebrow">${p.cat.toUpperCase()}</p><h1 class="page-title">${p.name}</h1><h2>$${p.price}</h2><p class="muted">${p.desc}</p><hr><p>✓ Premium quality selection</p><p>✓ Free shipping on eligible orders</p><p>✓ Easy returns</p><button class="btn dark" onclick="addCart(${p.id})">Add to Cart</button></div></div><div class="section-head"><h2>You may also like</h2></div><div class="products" id="related"></div>`;renderProducts('related',products.filter(x=>x.id!==p.id).slice(0,4))})</script><script src="assets/footer.js"></script></body></html>
