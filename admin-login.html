<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | ShopVerse</title>

  <link
    rel="stylesheet"
    href="assets/admin.css"
  >

</head>


<body class="admin-login-body">


  <div class="login-wrapper">


    <div class="login-card">

      <a
        href="index.html"
        class="admin-logo"
      >
        SHOPVERSE
      </a>


      <div class="login-icon">
        🔐
      </div>


      <h1>
        Admin Login
      </h1>


      <p>
        Sign in to manage your products and store.
      </p>


      <form id="loginForm">


        <label>
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="admin@email.com"
          required
        >


        <label>
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >


        <button
          type="submit"
          id="loginBtn"
          class="admin-primary-btn"
        >
          Login to Admin Panel
        </button>


        <div
          id="loginMessage"
          class="login-message"
        ></div>


      </form>


      <a
        href="index.html"
        class="back-store"
      >
        ← Back to Store
      </a>


    </div>


  </div>


  <script
    type="module"
    src="assets/admin.js"
  ></script>



<script src="assets/rellax.min.js"></script>
<script src="assets/animations.js"></script>
</body>

</html>
